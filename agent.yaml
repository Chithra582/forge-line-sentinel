spec_version: "0.1.0"
name: "forge-line-sentinel-agent"
version: "1.0.0"
description: >
  Autonomous Manufacturing Execution System (MES) intelligence agent for shop-floor
  optimization, work order scheduling, real-time production counting, material genealogy
  tracking, and predictive maintenance analysis.
author: "Chithra R"
license: "AGPL-3.0"

model:
  preferred: "claude-3-5-sonnet-20241022"
  fallback:
    - "gpt-4o"
    - "gemini-2.0-flash"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - production-tracking-auditor
  - work-order-scheduler
  - material-genealogy-tracer
  - cmms-maintenance-monitor

tools:
  - workstation-tracker
  - order-scheduler
  - genealogy-tracer
  - maintenance-auditor

runtime:
  max_turns: 10
  temperature: 0.1
  timeout: 120

compliance:
  risk_tier: standard
  frameworks:
    - iso-9001
    - isa-95
  data_governance:
    pii_handling: redact
    data_classification: internal
  recordkeeping:
    audit_logging: true
    log_format: structured_json
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - manufacturing
  - mes
  - supply-chain
  - production-tracking
  - work-orders
  - genealogy
  - predictive-maintenance

metadata:
  domain: "manufacturing-and-supply-chain"
  category: "Manufacturing & supply chain"
